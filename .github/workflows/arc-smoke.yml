name: ARC smoke test
on: workflow_dispatch
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - run: echo "runner=$RUNNER_NAME"
      - run: docker run --rm hello-world
      - run: gcc --version && aws --version && gh --version
      - run: test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
